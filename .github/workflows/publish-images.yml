name: 🐳 Publish FcgUsers Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 368379549295.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: fcg-users

jobs:
  publish:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 📦 Restore
        run: dotnet restore

      - name: 🔨 Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Execute Unit Tests
        run: |
          dotnet test tests/FcgUsers.UnitTests/FcgUsers.UnitTests.csproj \
            --no-build \
            --configuration Release

      - name: 🔑 Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: 🔐 Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏷️ Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build & Push Users API to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/FcgUsers.Api/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest