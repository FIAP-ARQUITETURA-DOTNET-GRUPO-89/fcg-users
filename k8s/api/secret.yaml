apiVersion: v1
kind: Secret
metadata:
  name: fcg-users-api-secret
  namespace: fcg-platform
  labels:
    app.kubernetes.io/name: fcg-users-api
    app.kubernetes.io/instance: fcg-users-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fcg-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  ConnectionStrings__Default: "${POSTGRES_CONNECTION_STRING}"
  ConnectionStrings__Rabbitmq: "${RABBITMQ_CONNECTION_STRING}"
  JwtSettings__SecurityKey: "${JWT_SECURITY_KEY}"